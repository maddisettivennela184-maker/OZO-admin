<div class="product-container">

    <!-- ================================= -->
    <!-- TOP SECTION -->
    <!-- ================================= -->

    <div class="top-section">

        <div>

            <h2>
                Product Management
            </h2>

            <p>
                Manage all products here
            </p>

        </div>
        <!-- Button Section -->
        <div class="button-section">
            <button routerLink="/admin/create-product">
                Add Products
            </button>
        </div>



    </div>

    <!-- ================================= -->
    <!-- SEARCH -->
    <!-- ================================= -->

    <div class="search-section">

        <mat-form-field appearance="outline" class="w-100">

            <mat-label>
                Search Product
            </mat-label>

            <input matInput placeholder="Enter Product Name" (keyup)="applyFilter($event)">

        </mat-form-field>

    </div>

    <!-- ================================= -->
    <!-- TABLE -->
    <!-- ================================= -->

    <div class="table-section">

        <table mat-table [dataSource]="dataSource" matSort>

            <!-- S.NO -->

            <ng-container matColumnDef="sno">

                <th mat-header-cell *matHeaderCellDef>

                    S.No

                </th>

                <td mat-cell *matCellDef="
            let element;
            let i = index
          ">

                    {{ i + 1 }}

                </td>

            </ng-container>

            <!-- IMAGE -->

            <ng-container matColumnDef="image">

                <th mat-header-cell *matHeaderCellDef>

                    Image

                </th>

                <td mat-cell *matCellDef="let element">

                    <img [src]="
              getProductImage(element)
            " class="product-image">

                </td>

            </ng-container>

            <!-- PRODUCT NAME -->

            <ng-container matColumnDef="name">

                <th mat-header-cell *matHeaderCellDef>

                    Product Name

                </th>

                <td mat-cell *matCellDef="let element">

                    {{ element.name }}

                </td>

            </ng-container>

            <!-- CATEGORY -->

            <ng-container matColumnDef="category">

                <th mat-header-cell *matHeaderCellDef>

                    Category

                </th>

                <td mat-cell *matCellDef="let element">

                    {{ element.category?.name }}

                </td>

            </ng-container>

            <!-- PRODUCT TYPE -->

            <ng-container matColumnDef="productType">

                <th mat-header-cell *matHeaderCellDef>

                    Product Type

                </th>

                <td mat-cell *matCellDef="let element">

                    {{ element.productType }}

                </td>

            </ng-container>

            <!-- FINAL PRICE -->

            <!-- <ng-container matColumnDef="price">

                <th mat-header-cell *matHeaderCellDef>

                    Final Price

                </th>

                <td mat-cell *matCellDef="let element">

                    ₹

                    {{
                    element.variants[0]?.finalPrice
                    }}

                </td>

            </ng-container> -->

            <!-- STATUS -->

            <ng-container matColumnDef="status">

                <th mat-header-cell *matHeaderCellDef>

                    Status

                </th>

                <td mat-cell *matCellDef="let element">

                    <span [ngClass]="
              element.isActive
              ? 'active'
              : 'inactive'
            ">

                        {{

                        element.isActive

                        ? 'Active'

                        : 'Inactive'

                        }}

                    </span>

                </td>

            </ng-container>

            <!-- ACTIONS -->

            <ng-container matColumnDef="actions">

                <th mat-header-cell *matHeaderCellDef>

                    Actions

                </th>

                <td mat-cell *matCellDef="let element">

                    <div class="action-buttons">

                        <!-- VIEW -->

                        <button mat-icon-button class="view-btn" (click)="viewProduct(element)">

                            <i class="fa fa-eye" aria-hidden="true"></i>

                        </button>

                        <!-- EDIT -->

                        <button mat-icon-button class="edit-btn" (click)="editProduct(element)">

                            <i class="fa fa-pencil"></i>

                        </button>

                        <!-- DELETE -->

                        <button mat-icon-button class="delete-btn" (click)="deleteProduct(element)">

                            <i class="fa fa-trash"></i>

                        </button>

                    </div>

                </td>

            </ng-container>

            <!-- HEADER -->

            <tr mat-header-row *matHeaderRowDef="
          displayedColumns
        "></tr>

            <!-- ROW -->

            <tr mat-row *matRowDef="
          let row;
          columns: displayedColumns
        "></tr>

        </table>

        <!-- PAGINATOR -->

        <mat-paginator [pageSizeOptions]="
        [5,10,20,50]
      " showFirstLastButtons>

        </mat-paginator>

    </div>

</div>
