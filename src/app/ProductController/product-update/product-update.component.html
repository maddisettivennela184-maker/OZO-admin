<!-- =========================
     update PRODUCT PAGE
========================= -->

<div class="container-fluid product-page">

  <div class="row">

    <div class="col-md-12">

      <!-- PAGE HEADER -->

      <div class="page-header">

        <div>

          <h2>
           Update Product
          </h2>

          <p>
            Add jewellery product details
          </p>

        </div>

      </div>

      <!-- FORM CARD -->

      <div class="product-card">

       <form
  [formGroup]="productForm"
  (ngSubmit)="onSubmit()"
>

  <!-- ========================================= -->
  <!-- PRODUCT DETAILS -->
  <!-- ========================================= -->

  <div class="product-grid">

    <!-- PRODUCT NAME -->

    <div class="form-group">

      <label>
        Product Name
      </label>

      <input
        type="text"
        placeholder="Enter Product Name"
        formControlName="name"
      >

    </div>

    <!-- SLUG -->

    <div class="form-group">

      <label>
        Slug
      </label>

      <input
        type="text"
        placeholder="Enter Slug"
        formControlName="slug"
      >

    </div>

    <!-- CATEGORY -->

    <div class="form-group">

  <label>
    Category
  </label>

  <select
    formControlName="category"
    (change)="onCategoryChange($event)"
  >

    <option value="">
      Select Category
    </option>

    <option
      *ngFor="let category of categories"
      [value]="category._id"
    >

      {{ category.name }}

    </option>

  </select>

</div>

    <!-- SUB CATEGORY -->

 <div class="form-group">

  <label>
    Sub Category
  </label>

  <select
    formControlName="subCategory"
    (change)="onSubCategoryChange($event)"
  >

    <option value="">
      Select Sub Category
    </option>

    <option
      *ngFor="
        let subCategory
        of subCategories
      "
      [value]="subCategory._id"
    >

      {{ subCategory.name }}

    </option>

  </select>

</div>

    <!-- SUB SUB CATEGORY -->

  <div class="form-group">

  <label>
    Sub Sub Category
  </label>

  <select
    formControlName="subSubCategory"
  >

    <option value="">
      Select Sub Sub Category
    </option>

    <option
      *ngFor="
        let subSubCategory
        of subSubCategories
      "
      [value]="subSubCategory._id"
    >

      {{ subSubCategory.name }}

    </option>

  </select>

</div>

    <!-- PRODUCT TYPE -->

    <div class="form-group">

      <label>
        Product Type
      </label>

      <select formControlName="productType">

        <option value="">
          Select Product Type
        </option>

        <option value="GOLD">
          GOLD
        </option>

        <option value="DIAMOND">
          DIAMOND
        </option>

        <option value="GOLD_DIAMOND">
          GOLD_DIAMOND
        </option>

      </select>

    </div>

    <!-- GENDER -->

    <div class="form-group">

      <label>
        Gender
      </label>

      <select formControlName="gender">

        <option value="">
          Select Gender
        </option>

        <option value="MEN">
          MEN
        </option>

        <option value="WOMEN">
          WOMEN
        </option>

        <option value="UNISEX">
          UNISEX
        </option>

      </select>

    </div>

    <!-- OCCASION -->

    <div class="form-group">

      <label>
        Occasion
      </label>

      <input
        type="text"
        placeholder="Enter Occasion"
        formControlName="occasion"
      >

    </div>

    <!-- BRAND -->

    <div class="form-group">

      <label>
        Brand
      </label>

      <input
        type="text"
        placeholder="Enter Brand"
        formControlName="brand"
      >

    </div>

    <!-- SKU -->

    <div class="form-group">

      <label>
        SKU
      </label>

      <input
        type="text"
        placeholder="Enter SKU"
        formControlName="sku"
      >

    </div>

    <!-- TAGS -->

    <div class="form-group">

      <label>
        Tags
      </label>

      <input
        type="text"
        placeholder="ring, gold, diamond"
        formControlName="tags"
      >

    </div>

    <!-- SEO TITLE -->

    <div class="form-group">

      <label>
        SEO Title
      </label>

      <input
        type="text"
        placeholder="Enter SEO Title"
        formControlName="seoTitle"
      >

    </div>

  </div>

  <!-- SHORT DESCRIPTION -->

  <div class="form-group">

    <label>
      Short Description
    </label>

    <textarea
      placeholder="Enter Short Description"
      formControlName="shortDescription"
    ></textarea>

  </div>

  <!-- DESCRIPTION -->

  <div class="form-group">

    <label>
      Description
    </label>

    <textarea
      placeholder="Enter Description"
      formControlName="description"
    ></textarea>

  </div>

  <!-- SEO DESCRIPTION -->

  <div class="form-group">

    <label>
      SEO Description
    </label>

    <textarea
      placeholder="Enter SEO Description"
      formControlName="seoDescription"
    ></textarea>

  </div>

  <!-- ========================================= -->
  <!-- CHECKBOX -->
  <!-- ========================================= -->

  <div class="checkbox-container">

    <label>
      <input
        type="checkbox"
        formControlName="hallmarkCertified"
      >
      Hallmark Certified
    </label>

    <label>
      <input
        type="checkbox"
        formControlName="certificationIncluded"
      >
      Certification Included
    </label>

    <label>
      <input
        type="checkbox"
        formControlName="featured"
      >
      Featured
    </label>

    <label>
      <input
        type="checkbox"
        formControlName="bestSeller"
      >
      Best Seller
    </label>

    <label>
      <input
        type="checkbox"
        formControlName="trending"
      >
      Trending
    </label>

    <label>
      <input
        type="checkbox"
        formControlName="isActive"
      >
      Active
    </label>

  </div>

  <!-- ========================================= -->
  <!-- IMAGES -->
  <!-- ========================================= -->

  <h2>
    Product Images
  </h2>

  <div class="form-group">

    <label>
      Upload Images
    </label>

    <input
      type="file"
      multiple
      accept="image/*"
      (change)="onImageSelect($event)"
    >

  </div>

  <div class="image-preview-container">

    <div
      class="image-preview-card"

      *ngFor="
        let img of imagePreview;
        let i = index
      "
    >

      <img
        [src]="img"
      >

      <button
        type="button"
        class="image-remove-btn"
        (click)="removeImage(i)"
      >
        X
      </button>

    </div>

  </div>

  <!-- ========================================= -->
  <!-- VIDEO -->
  <!-- ========================================= -->

  <h2>
    Product Video
  </h2>

  <div class="form-group">

    <label>
      Upload Video
    </label>

    <input
      type="file"
      accept="video/*"
      (change)="onVideoSelect($event)"
    >

  </div>

  <video
    *ngIf="videoPreview"
    controls
  >

    <source
      [src]="videoPreview"
    >

  </video>

  <!-- ========================================= -->
  <!-- CERTIFICATE -->
  <!-- ========================================= -->

  <h2>
    Certificate
  </h2>

  <div class="form-group">

    <label>
      Upload Certificate
    </label>

    <input
      type="file"
      (change)="onCertificateSelect($event)"
    >

  </div>

  <!-- ========================================= -->
  <!-- VARIANTS -->
  <!-- ========================================= -->

  <div formArrayName="variants">

    <div

      class="variant-card"

      *ngFor="
        let variant of variants.controls;
        let i = index
      "

      [formGroupName]="i"
    >

      <h2>
        Variant {{ i + 1 }}
      </h2>

      <div class="variant-grid">

        <!-- SIZE -->

        <div class="form-group">

          <label>
            Size
          </label>

          <input
            type="text"
            placeholder="Enter Size"
            formControlName="size"
          >

        </div>

        <!-- STOCK -->

        <div class="form-group">

          <label>
            Stock
          </label>

          <input
            type="number"
            placeholder="Enter Stock"
            formControlName="stock"
          >

        </div>

        <!-- GOLD PURITY -->

        <div class="form-group">

          <label>
            Gold Purity
          </label>

          <select
            formControlName="goldPurity"
          >

            <option value="">
              Select Gold Purity
            </option>

            <option value="14K">
              14K
            </option>

            <option value="18K">
              18K
            </option>

            <option value="22K">
              22K
            </option>

            <option value="24K">
              24K
            </option>

          </select>

        </div>

        <!-- GOLD COLOR -->

        <div class="form-group">

          <label>
            Gold Color
          </label>

          <select
            formControlName="goldColor"
          >

            <option value="">
              Select Gold Color
            </option>

            <option value="YELLOW">
              YELLOW
            </option>

            <option value="WHITE">
              WHITE
            </option>

            <option value="ROSE">
              ROSE
            </option>

          </select>

        </div>

        <!-- GROSS WEIGHT -->

        <div class="form-group">

          <label>
            Gross Weight
          </label>

          <input
            type="number"
            placeholder="Enter Gross Weight"
            formControlName="grossWeight"
          >

        </div>

        <!-- NET WEIGHT -->

        <div class="form-group">

          <label>
            Net Weight
          </label>

          <input
            type="number"
            placeholder="Enter Net Weight"
            formControlName="netWeight"
          >

        </div>

        <!-- MAKING CHARGES -->

        <div class="form-group">

          <label>
            Making Charges
          </label>

          <input
            type="number"
            placeholder="Enter Making Charges"
            formControlName="makingCharges"
          >

        </div>

        <!-- WASTAGE -->

        <div class="form-group">

          <label>
            Wastage %
          </label>

          <input
            type="number"
            placeholder="Enter Wastage"
            formControlName="wastagePercentage"
          >

        </div>

      

        

        <!-- GOLD PRICE -->

        <div class="form-group">

          <label>
            Gold Price
          </label>

          <input
            type="number"
            placeholder="Enter Gold Price"
            formControlName="goldPrice"
          >

        </div>

      

        

        <!-- BASE PRICE -->

        <div class="form-group">

          <label>
            Base Price
          </label>

          <input
            type="number"
            placeholder="Enter Base Price"
            formControlName="basePrice"
          >

        </div>

        <!-- DISCOUNT -->

        <div class="form-group">

          <label>
            Discount %
          </label>

          <input
            type="number"
            placeholder="Enter Discount"
            formControlName="discountPercentage"
          >

        </div>

        

       

      </div>

      <!-- HAS DIAMOND -->

      <label>

        <input
          type="checkbox"
          formControlName="hasDiamond"
        >

        Has Diamond

      </label>

      <!-- ========================================= -->
      <!-- DIAMONDS -->
      <!-- ========================================= -->

      <div formArrayName="diamonds">

        <div

          class="diamond-card"

          *ngFor="
            let diamond of getDiamonds(i).controls;
            let j = index
          "

          [formGroupName]="j"
        >

          <h3>
            Diamond {{ j + 1 }}
          </h3>

          <div class="diamond-grid">

            <!-- DIAMOND TYPE -->

            <div class="form-group">

              <label>
                Diamond Type
              </label>

              <select
                formControlName="diamondType"
              >

                <option value="NATURAL">
                  NATURAL
                </option>

                <option value="LAB_GROWN">
                  LAB_GROWN
                </option>

              </select>

            </div>

            <!-- SHAPE -->

            <div class="form-group">

              <label>
                Shape
              </label>

              <select
                formControlName="shape"
              >

                <option value="ROUND">
                  ROUND
                </option>

                <option value="OVAL">
                  OVAL
                </option>

                <option value="PRINCESS">
                  PRINCESS
                </option>

                <option value="CUSHION">
                  CUSHION
                </option>

                <option value="EMERALD">
                  EMERALD
                </option>

                <option value="PEAR">
                  PEAR
                </option>

                <option value="HEART">
                  HEART
                </option>

                <option value="MARQUISE">
                  MARQUISE
                </option>

              </select>

            </div>

            <!-- CARAT -->

            <div class="form-group">

              <label>
                Carat
              </label>

              <input
                type="number"
                placeholder="Enter Carat"
                formControlName="carat"
              >

            </div>

            <!-- COLOR -->

            <div class="form-group">

              <label>
                Color
              </label>

              <input
                type="text"
                placeholder="Enter Color"
                formControlName="color"
              >

            </div>

            <!-- CLARITY -->

            <div class="form-group">

              <label>
                Clarity
              </label>

              <input
                type="text"
                placeholder="Enter Clarity"
                formControlName="clarity"
              >

            </div>

            <!-- CUT -->

            <div class="form-group">

              <label>
                Cut
              </label>

              <input
                type="text"
                placeholder="Enter Cut"
                formControlName="cut"
              >

            </div>

            <!-- POLISH -->

            <div class="form-group">

              <label>
                Polish
              </label>

              <input
                type="text"
                placeholder="Enter Polish"
                formControlName="polish"
              >

            </div>
            <div class="form-group">

  <label>
    Symmetry
  </label>

  <input
    type="text"
    placeholder="Enter Symmetry"
    formControlName="symmetry"
  >

</div>
<div class="form-group">

  <label>
    Fluorescence
  </label>

  <input
    type="text"
    placeholder="Enter Fluorescence"
    formControlName="fluorescence"
  >

</div>
<div class="form-group">

  <label>
    Certificate Lab
  </label>

  <select
    formControlName="certificateLab"
  >

    <option value="NONE">
      NONE
    </option>

    <option value="GIA">
      GIA
    </option>

    <option value="IGI">
      IGI
    </option>

    <option value="HRD">
      HRD
    </option>

    <option value="AGS">
      AGS
    </option>

  </select>

</div>
<div class="form-group">

  <label>
    Certificate Number
  </label>

  <input
    type="text"
    placeholder="Enter Certificate Number"
    formControlName="certificateNumber"
  >

</div>
<div class="form-group">

  <label>
    Diamond Price
  </label>

  <input
    type="number"
    placeholder="Enter Diamond Price"
    formControlName="diamondPrice"
  >

</div>
<div class="form-group">

  <label>
    Total Diamonds
  </label>

  <input
    type="number"
    placeholder="Enter Total Diamonds"
    formControlName="totalDiamonds"
  >

</div>

          </div>

        </div>

      </div>

      <button
        type="button"
        (click)="addDiamond(i)"
      >
        Add Diamond
      </button>

      <button
        type="button"
        class="remove-btn"
        (click)="removeVariant(i)"
      >
        Remove Variant
      </button>

    </div>

  </div>

  <button
    type="button"
    (click)="addVariant()"
  >
    Add Variant
  </button>

  <br><br>
<div class="button-group">

          <button
            type="submit"
            class="btn-create">

         Update
          </button>

          <button
            type="button"
            class="btn-bake"
            (click)="goBack()">

            Back
          </button>

        </div>
  


</form>

      </div>

    </div>

  </div>

</div>
