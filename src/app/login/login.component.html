<div class="container-fluid container-one bg_lite">

  <div class="auth-card">

    <!-- Left Panel -->
    <div class="left-panel">

      <div class="tabs"></div>

    </div>

    <!-- Right Panel -->
    <div class="right-panel">

      <div class="user-icon">
        <img src="../../assets/Images/logo.png">
      </div>

      <h2>
        {{ isLogin ? 'LOGIN' : 'REGISTER' }}
      </h2>

      <form
        [formGroup]="authForm"
        (ngSubmit)="onSubmit()">

        <!-- Name (Register Only) -->

        <div
          class="input-box"
          *ngIf="!isLogin">

          <i class="fa fa-user"></i>

          <input
            type="text"
            placeholder="Name"
            formControlName="name">

        </div>

        <!-- Email -->

        <div class="input-box">

          <i class="fa fa-envelope"></i>

          <input
            type="email"
            placeholder="Email"
            formControlName="email">

        </div>

        <!-- Password -->

        <div class="input-box">

          <i class="fa fa-lock"></i>

          <input
            type="password"
            placeholder="Password"
            formControlName="password">

        </div>

        <!-- Login Links -->

        <div
          class="auth-links"
          *ngIf="isLogin">

          <span
            class="forgot"
            (click)="forgotPassword()">

            Forgot Password?

          </span>

          <span
            class="signup-link"
            (click)="signupForm()">

            Sign Up

          </span>

        </div>

        <!-- Register Links -->

        <div
          class="auth-links"
          *ngIf="!isLogin">

          <span>
            Already have an account?
          </span>

          <span
            class="signup-link"
            (click)="signupForm()">

            Login

          </span>

        </div>

        <!-- Submit Button -->

        <button
          type="submit"
          class="login-btn">

          {{ isLogin ? 'LOGIN' : 'REGISTER' }}

        </button>

      </form>

    </div>

  </div>

</div>
