<div class="category-container">

  <div class="top-row">

    <div class="title-section">
      <h2>Ads Management</h2>
      <p>Manage all ads here</p>
    </div>

    

  </div>

  <div class="search-row">

    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Search Ads
      </mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Enter title">

    </mat-form-field>

  </div>

  <div class="table-row">

    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8">

      <!-- Section -->
      <ng-container matColumnDef="section">

        <th mat-header-cell *matHeaderCellDef>
          Section
        </th>

        <td mat-cell *matCellDef="let element">

          {{ element.sectionName }}

        </td>

      </ng-container>

      <!-- Title -->
      <ng-container matColumnDef="title">

        <th mat-header-cell *matHeaderCellDef>
          Title
        </th>

        <td mat-cell *matCellDef="let element">

          {{ element.title }}

        </td>

      </ng-container>

      <!-- Description -->
      <ng-container matColumnDef="description">

        <th mat-header-cell *matHeaderCellDef>
          Description
        </th>

        <td mat-cell *matCellDef="let element">

          {{ element.description }}

        </td>

      </ng-container>

      <!-- Image 1 -->
      <ng-container matColumnDef="image1">

        <th mat-header-cell *matHeaderCellDef>
          Image 1
        </th>

        <td mat-cell *matCellDef="let element">

          <img
            *ngIf="element.images?.[0]"
            [src]="element.images[0]"
            width="60"
            height="60">

        </td>

      </ng-container>

      <!-- Image 2 -->
      <ng-container matColumnDef="image2">

        <th mat-header-cell *matHeaderCellDef>
          Image 2
        </th>

        <td mat-cell *matCellDef="let element">

          <img
            *ngIf="element.images?.[1]"
            [src]="element.images[1]"
            width="60"
            height="60">

        </td>

      </ng-container>

      <!-- Image 3 -->
      <ng-container matColumnDef="image3">

        <th mat-header-cell *matHeaderCellDef>
          Image 3
        </th>

        <td mat-cell *matCellDef="let element">

          <img
            *ngIf="element.images?.[2]"
            [src]="element.images[2]"
            width="60"
            height="60">

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>
    
   <mat-paginator
  [pageSizeOptions]="[5, 10, 20, 50]"
  showFirstLastButtons>
</mat-paginator>

<div class="button-group">

  <button
    type="submit"
    class="btn-create"
    (click)="editAds()">

    <i class="fa fa-pencil"></i>
    Update

  </button>

  <button
    type="button"
    class="btn-back"
    (click)="deleteAds()">

    <i class="fa fa-trash"></i>
    Delete

  </button>

</div>

   

  </div>

</div>
